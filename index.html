<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BooksHaven - A simple, minimal, and elegant book reading tracker.">
  <title>BooksHaven — Minimal Book Tracker</title>

  <!-- Google Fonts: Inter & Newsreader for editorial aesthetic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="site-container">
    <!-- Header -->
    <header class="site-header">
      <div class="brand">
        <h1 class="brand-title">BooksHaven</h1>
        <p class="brand-tagline">A quiet place for books you want to read, are reading, or have finished.</p>
      </div>

      <div class="header-action">
        <button id="openModalBtn" class="btn btn-primary" type="button">
          + Add Book
        </button>
      </div>
    </header>

    <!-- Overview Bar & Search -->
    <section class="controls-section" aria-label="Book controls and filters">
      <div class="search-wrapper">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search by title or author..." 
          autocomplete="off"
          aria-label="Search books by title or author"
        >
        <button id="clearSearchBtn" class="clear-search-btn" title="Clear search" aria-label="Clear search" hidden>&times;</button>
      </div>

      <!-- Filter Tabs / Status Pill counters -->
      <nav class="filter-tabs" aria-label="Filter books by status">
        <button class="filter-tab active" data-filter="all" type="button">
          All <span class="tab-count" id="countAll">0</span>
        </button>
        <button class="filter-tab" data-filter="To read" type="button">
          To read <span class="tab-count" id="countToRead">0</span>
        </button>
        <button class="filter-tab" data-filter="Reading" type="button">
          Reading <span class="tab-count" id="countReading">0</span>
        </button>
        <button class="filter-tab" data-filter="Finished" type="button">
          Finished <span class="tab-count" id="countFinished">0</span>
        </button>
      </nav>
    </section>

    <!-- Main Content Area: Book List -->
    <main class="main-content">
      <div class="list-header">
        <h2 class="section-heading" id="viewTitle">All Books</h2>
        <span class="sort-indicator">Sorted newest first</span>
      </div>

      <!-- Books List Container -->
      <ul id="booksList" class="books-list" aria-live="polite">
        <!-- Dynamically rendered via safe DOM methods -->
      </ul>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state" hidden>
        <div class="empty-icon" aria-hidden="true">📖</div>
        <h3 class="empty-title">No books found</h3>
        <p class="empty-desc" id="emptyStateMessage">Your reading list is empty. Add a book to get started.</p>
        <button id="emptyStateAddBtn" class="btn btn-secondary" type="button">+ Add Your First Book</button>
      </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <p>BooksHaven &bull; Minimal personal book tracking.</p>
    </footer>
  </div>

  <!-- Add Book Modal Dialog -->
  <div id="bookModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle" class="modal-title">Add a Book</h2>
        <button id="closeModalBtn" class="close-btn" type="button" aria-label="Close dialog">&times;</button>
      </div>

      <form id="bookForm" novalidate>
        <!-- Title Field -->
        <div class="form-group">
          <label for="bookTitle">Title <span class="required" aria-hidden="true">*</span></label>
          <input 
            type="text" 
            id="bookTitle" 
            placeholder="e.g. The Great Gatsby" 
            autocomplete="off"
            aria-describedby="titleError"
          >
          <div id="titleError" class="field-error" role="alert" aria-live="assertive"></div>
        </div>

        <!-- Author Field -->
        <div class="form-group">
          <label for="bookAuthor">Author <span class="required" aria-hidden="true">*</span></label>
          <input 
            type="text" 
            id="bookAuthor" 
            placeholder="e.g. F. Scott Fitzgerald" 
            autocomplete="off"
            aria-describedby="authorError"
          >
          <div id="authorError" class="field-error" role="alert" aria-live="assertive"></div>
        </div>

        <!-- Status Field -->
        <div class="form-group">
          <label for="bookStatus">Reading Status</label>
          <select id="bookStatus">
            <option value="To read">To read</option>
            <option value="Reading">Reading</option>
            <option value="Finished">Finished</option>
          </select>
        </div>

        <!-- Modal Actions -->
        <div class="modal-actions">
          <button type="button" id="cancelModalBtn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Book</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Notification Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- JavaScript Modules -->
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
